name: Image

# Builds and pushes a multi-arch (amd64 + arm64) image to
# ghcr.io/jhjessup/actual-mcp-server -- this fork carries entity-id
# validation/disclosure fixes not yet in agigante80/actual-mcp-server
# upstream (see the fix/entity-id-validation-and-disclosure history), and
# the target Kubernetes node is an Oracle Ampere A1 arm64 box, same reason
# jhjessup/actual-budget-connector and jhjessup/mcp-gateway build multi-arch.
#
# This does NOT change what jessups-gitops deploys by itself -- that's a
# separate manifest change (apps/actual-budget-connector/
# deployment-actual-mcp.yaml) pointing at this image instead of the
# original agigante80/actual-mcp-server:latest.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/image.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push (ghcr.io)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          echo "tags=ghcr.io/${REPO}/actual-mcp-server:latest,ghcr.io/${REPO}/actual-mcp-server:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### actual-mcp-server image published (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`actual-mcp-server\` | \`latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A package built via the default GITHUB_TOKEN defaults to" >> $GITHUB_STEP_SUMMARY
          echo "private regardless of this repo's own (public) visibility." >> $GITHUB_STEP_SUMMARY
          echo "Either make it public on GHCR (Settings -> Package settings" >> $GITHUB_STEP_SUMMARY
          echo "-> Change visibility), or pull it via the shared ghcr-pull" >> $GITHUB_STEP_SUMMARY
          echo "imagePullSecret already used by podcast and" >> $GITHUB_STEP_SUMMARY
          echo "actual-budget-connector in jessups-gitops." >> $GITHUB_STEP_SUMMARY
